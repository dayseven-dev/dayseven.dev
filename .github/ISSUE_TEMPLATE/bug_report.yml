name: "Bug report"
description: "Something in this project does not work as expected."
labels: ["fix"]
body:
    - type: "markdown"
      attributes:
          value: "Search existing issues first. Report vulnerabilities via SECURITY.md."
    - type: "dropdown"
      id: "platform"
      attributes:
          label: "Platform"
          multiple: true
          options:
              - "Android"
              - "iOS"
              - "Desktop"
              - "Web"
              - "Extension"
              - "Backend"
      validations:
          required: true
    - type: "input"
      id: "version"
      attributes:
          label: "Version"
          placeholder: "v0.3.0"
      validations:
          required: true
    - type: "textarea"
      id: "steps"
      attributes:
          label: "Steps to reproduce"
          placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
      validations:
          required: true
    - type: "textarea"
      id: "expected"
      attributes:
          label: "Expected result"
      validations:
          required: true
    - type: "textarea"
      id: "actual"
      attributes:
          label: "Actual result"
      validations:
          required: true
    - type: "textarea"
      id: "screenshots"
      attributes:
          label: "Screenshots"
          description: "Optional. Drag images or recordings here."
