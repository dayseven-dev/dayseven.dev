# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Internal option: keeps the configuration cache report in .build/ even when the build script fails
org.gradle.internal.configuration-cache.report-output-directory=.build/project/reports/configuration-cache

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Android
android.useAndroidX=true